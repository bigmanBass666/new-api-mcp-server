# Conformance expected failures baseline
# These scenarios fail because they require a reference MCP server with
# specific test tool/resource/prompt names (e.g. "test_simple_text").
# Our server is a production MCP server with real tool names.
# The passing scenarios (initialize, tools/list, ping, etc.) confirm
# protocol compliance at the JSON-RPC level.

scenarios:
  - completion-complete
  - tools-call-simple-text
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-error
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - dns-rebinding-protection
